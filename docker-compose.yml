# Alternative to Vercel: self-host app + Postgres + automatic HTTPS on any small server.
#   cp .env.example .env   (set STATEMENT_ENCRYPTION_KEY, DOMAIN, POSTGRES_PASSWORD)
#   docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tandem
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    environment:
      STATEMENT_ENCRYPTION_KEY: ${STATEMENT_ENCRYPTION_KEY}
      DATABASE_URL: postgresql://tandem:${POSTGRES_PASSWORD}@db:5432/tandem
      DATABASE_URL_UNPOOLED: postgresql://tandem:${POSTGRES_PASSWORD}@db:5432/tandem
      APP_URL: https://${DOMAIN}
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN} --to app:3000
    volumes: [caddy-data:/data]
volumes:
  pgdata:
  caddy-data:
